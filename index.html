<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2C1A0E" />
  <meta name="description" content="Deine persönliche Rezepte-App mit KI-Unterstützung" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rezepte" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>Meine Rezepte</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap');

    :root {
      --bg:        #FDF6EE;
      --surface:   #FFF8F0;
      --brown-dark:#2C1A0E;
      --brown:     #5C3D2E;
      --brown-mid: #8B5E3C;
      --brown-light:#C4956A;
      --cream:     #E8D5B7;
      --accent:    #D4541A;
      --green:     #4A7C59;
      --text:      #2C1A0E;
      --text-light:#6B4A30;
      --border:    #DEC9A8;
      --shadow:    rgba(44,26,14,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overscroll-behavior-y: none;
    }

    /* ── Header ── */
    header {
      background: var(--brown-dark);
      color: #FDF6EE;
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.35);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      letter-spacing: .5px;
      line-height: 1.1;
    }
    header h1 span { color: var(--brown-light); }
    .header-actions { display: flex; gap: 8px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      font-family: 'Lato', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #b8431a; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--cream);
      color: var(--brown-dark);
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-ghost {
      background: transparent;
      color: #FDF6EE;
      border: 1.5px solid rgba(255,255,255,.35);
      padding: 7px 13px;
    }
    .btn-ghost:hover { background: rgba(255,255,255,.1); }
    .btn-danger {
      background: transparent;
      color: #c0392b;
      border: none;
      padding: 4px 8px;
      font-size: .8rem;
    }
    .btn-danger:hover { background: #fdecea; border-radius: 6px; }
    .btn-sm { padding: 6px 12px; font-size: .82rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── Search & Filter ── */
    .controls {
      padding: 14px 20px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      background: var(--bg);
      font-family: 'Lato', sans-serif;
      font-size: .9rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .search-wrap input:focus { border-color: var(--brown-mid); }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--brown-light);
      font-size: 1rem;
    }
    .filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .pill {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: .82rem;
      font-weight: 700;
      color: var(--text-light);
      cursor: pointer;
      transition: all .15s;
    }
    .pill.active {
      background: var(--brown-dark);
      border-color: var(--brown-dark);
      color: #FDF6EE;
    }
    .pill:hover:not(.active) { border-color: var(--brown-mid); color: var(--brown); }

    /* ── Recipe Grid ── */
    main {
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .recipe-card {
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 10px var(--shadow);
      transition: transform .2s, box-shadow .2s;
      cursor: pointer;
      position: relative;
    }
    .recipe-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px var(--shadow);
    }
    .card-emoji {
      background: linear-gradient(135deg, var(--cream) 0%, #E0C89A 100%);
      text-align: center;
      font-size: 3rem;
      padding: 24px 0 18px;
      line-height: 1;
    }
    .card-body { padding: 14px 16px 16px; }
    .card-category {
      display: inline-block;
      background: var(--cream);
      color: var(--brown-mid);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 10px;
      color: var(--brown-dark);
    }
    .card-meta {
      display: flex;
      gap: 12px;
      font-size: .8rem;
      color: var(--text-light);
      flex-wrap: wrap;
    }
    .card-meta span { display: flex; align-items: center; gap: 3px; }
    .card-actions {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .delete-btn {
      background: rgba(255,255,255,.85);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: .85rem;
      opacity: 0;
      transition: opacity .2s;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    .recipe-card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: #fdecea; }

    /* ── Empty State ── */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .empty .empty-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .empty p { font-size: 1rem; line-height: 1.5; }

    /* ── Modal Overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(44,26,14,.55);
      backdrop-filter: blur(3px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }

    /* ── Modals ── */
    .modal {
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 24px 24px 32px;
      animation: slideUp .3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--brown-dark);
    }
    .close-btn {
      background: var(--cream);
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--brown);
      transition: background .15s;
    }
    .close-btn:hover { background: var(--border); }

    /* ── Form ── */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: .85rem;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 5px;
      letter-spacing: .3px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      font-family: 'Lato', sans-serif;
      font-size: .9rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--brown-mid); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    /* ── AI Loading ── */
    .ai-spinner {
      display: none;
      text-align: center;
      padding: 32px;
      color: var(--text-light);
    }
    .ai-spinner.show { display: block; }
    .spinner-ring {
      width: 44px;
      height: 44px;
      border: 3px solid var(--cream);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Detail Modal ── */
    .detail-emoji {
      background: linear-gradient(135deg, var(--cream) 0%, #E0C89A 100%);
      text-align: center;
      font-size: 4rem;
      padding: 28px 0;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .detail-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brown-dark);
      margin-bottom: 8px;
    }
    .detail-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .badge {
      padding: 5px 12px;
      border-radius: 12px;
      font-size: .8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge-kcal  { background: #FEF3C7; color: #92400E; }
    .badge-prot  { background: #D1FAE5; color: #065F46; }
    .badge-time  { background: #E0E7FF; color: #3730A3; }
    .badge-cat   { background: var(--cream); color: var(--brown); }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--brown-dark);
      margin: 20px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1.5px solid var(--border);
    }

    .ingredients-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ingredients-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      color: var(--text);
    }
    .ingredients-list li::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brown-light);
      flex-shrink: 0;
    }

    .steps-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .steps-list li {
      display: flex;
      gap: 12px;
      font-size: .9rem;
      line-height: 1.55;
    }
    .step-num {
      background: var(--brown-dark);
      color: #FDF6EE;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .tip-box {
      background: linear-gradient(135deg, #FEF9EE, #FDF3DC);
      border-left: 4px solid var(--brown-light);
      border-radius: 0 10px 10px 0;
      padding: 12px 16px;
      margin-top: 18px;
      font-size: .88rem;
      color: var(--brown-dark);
      line-height: 1.5;
    }
    .tip-box strong { font-family: 'Playfair Display', serif; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--brown-dark);
      color: #FDF6EE;
      padding: 12px 22px;
      border-radius: 24px;
      font-size: .88rem;
      font-weight: 700;
      z-index: 999;
      transition: transform .3s ease;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── API Key Note ── */
    .api-note {
      background: #FEF9EE;
      border: 1px solid var(--cream);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .82rem;
      color: var(--brown);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .api-note a { color: var(--accent); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--cream); border-radius: 3px; }

    @media (max-width: 480px) {
      header h1 { font-size: 1.3rem; }
      .grid { grid-template-columns: 1fr; }
      .modal { padding: 20px 18px 28px; }
      .btn-ghost span { display: none; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-top">
    <h1>Meine <span>Rezepte</span></h1>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" id="btnOpenAI">
        ✨ <span>KI-Rezept</span>
      </button>
    </div>
  </div>
</header>

<!-- Controls -->
<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Rezepte suchen…" />
  </div>
  <div class="filter-pills" id="filterPills">
    <button class="pill active" data-cat="Alle">Alle</button>
    <button class="pill" data-cat="Fisch &amp; Meeresfrüchte">🐟 Fisch</button>
    <button class="pill" data-cat="Vegetarisch">🥗 Vegetarisch</button>
    <button class="pill" data-cat="Fleisch">🥩 Fleisch</button>
    <button class="pill" data-cat="Pasta &amp; Getreide">🍝 Pasta</button>
    <button class="pill" data-cat="Suppen &amp; Eintöpfe">🍲 Suppen</button>
    <button class="pill" data-cat="Salate">🥙 Salate</button>
  </div>
</div>

<!-- Main Grid -->
<main>
  <div class="grid" id="recipeGrid"></div>
</main>

<!-- ── AI Generate Modal ── -->
<div class="overlay" id="aiOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>✨ KI-Rezept generieren</h2>
      <button class="close-btn" id="closeAI">✕</button>
    </div>
    <div class="api-note">
      <strong>🔑 Anthropic API-Key benötigt.</strong> Dein Key wird nur lokal in deinem Browser gespeichert und nie an Server übertragen.<br>
      <a href="https://console.anthropic.com" target="_blank" rel="noopener">Hier kostenlos registrieren →</a>
    </div>
    <div class="form-group">
      <label>Anthropic API-Key</label>
      <input type="password" id="apiKey" placeholder="sk-ant-…" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Kategorie</label>
        <select id="genCategory">
          <option>Fisch &amp; Meeresfrüchte</option>
          <option>Vegetarisch</option>
          <option>Fleisch</option>
          <option>Pasta &amp; Getreide</option>
          <option>Suppen &amp; Eintöpfe</option>
          <option>Salate</option>
        </select>
      </div>
      <div class="form-group">
        <label>Max. Kalorien</label>
        <input type="number" id="genCalories" placeholder="z.B. 500" min="100" max="2000" />
      </div>
    </div>
    <div class="form-group">
      <label>Wunsch / Zutaten (optional)</label>
      <textarea id="genWish" placeholder="z.B. mit Hähnchen, mediterran, ohne Laktose…"></textarea>
    </div>
    <div class="ai-spinner" id="aiSpinner">
      <div class="spinner-ring"></div>
      <p>Claude kocht für dich…</p>
    </div>
    <button class="btn btn-primary" id="btnGenerate" style="width:100%">
      ✨ Rezept generieren
    </button>
  </div>
</div>

<!-- ── Detail Modal ── -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal">
    <!-- filled by JS -->
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── Data ──────────────────────────────────────────────────
const DEFAULT_RECIPES = [
  {
    id: 'r1',
    title: 'Garnelen-Pfanne mit Zucchini & Knoblauch',
    emoji: '🦐',
    kcal: 320,
    protein: 38,
    time: 15,
    category: 'Fisch & Meeresfrüchte',
    ingredients: [
      '300 g Garnelen (TK, aufgetaut)',
      '1 Zucchini',
      '3 Knoblauchzehen',
      '2 EL Olivenöl',
      '1 TL Paprikapulver',
      'Salz, Pfeffer, Zitronensaft',
      'Frische Petersilie'
    ],
    steps: [
      'Zucchini in Halbmonde schneiden, Knoblauch fein hacken.',
      'Olivenöl in einer Pfanne bei mittlerer Hitze erhitzen.',
      'Zucchini 3 Minuten anbraten, bis sie leicht goldbraun ist.',
      'Knoblauch zugeben, 1 Minute mitbraten.',
      'Garnelen hinzufügen, mit Paprikapulver würzen, 3–4 Minuten braten bis sie rosa sind.',
      'Mit Salz, Pfeffer und einem Spritzer Zitronensaft abschmecken.',
      'Mit frischer Petersilie bestreuen und sofort servieren.'
    ],
    tip: 'Für extra Aroma die Garnelen vor dem Braten 10 Minuten in Zitronensaft und Knoblauch marinieren.'
  },
  {
    id: 'r2',
    title: 'Shakshuka-Style Eier mit Kichererbsen & Spinat',
    emoji: '🥚',
    kcal: 420,
    protein: 28,
    time: 15,
    category: 'Vegetarisch',
    ingredients: [
      '4 Eier',
      '1 Dose Kichererbsen (400 g)',
      '100 g frischer Blattspinat',
      '1 Dose gehackte Tomaten',
      '1 Zwiebel',
      '2 Knoblauchzehen',
      '1 TL Kreuzkümmel, 1 TL Paprika',
      'Salz, Pfeffer, Olivenöl'
    ],
    steps: [
      'Zwiebel und Knoblauch fein hacken, in Olivenöl 3 Minuten anschwitzen.',
      'Kreuzkümmel und Paprikapulver zufügen, 30 Sekunden rösten.',
      'Tomaten und abgetropfte Kichererbsen einrühren, 5 Minuten köcheln lassen.',
      'Spinat unterheben und zusammenfallen lassen.',
      'Vier Mulden in die Sauce drücken, je ein Ei hineingeben.',
      'Zugedeckt 5–6 Minuten stocken lassen bis das Eiweiß fest ist.',
      'Mit Salz und Pfeffer abschmecken, mit Brot servieren.'
    ],
    tip: 'Ein Klecks Feta oder griechischer Joghurt obendrauf macht das Gericht noch cremiger und rundet den Geschmack ab.'
  }
];

const STORAGE_KEY = 'rezepte_v1';
const APIKEY_KEY  = 'rezepte_apikey';

function loadRecipes() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) return JSON.parse(data);
  } catch {}
  return DEFAULT_RECIPES.map(r => ({ ...r }));
}

function saveRecipes(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

let recipes = loadRecipes();
let activeCategory = 'Alle';
let searchTerm = '';

// ── Render ────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('recipeGrid');
  const filtered = recipes.filter(r => {
    const matchCat = activeCategory === 'Alle' || r.category === activeCategory;
    const term = searchTerm.toLowerCase();
    const matchSearch = !term ||
      r.title.toLowerCase().includes(term) ||
      r.category.toLowerCase().includes(term);
    return matchCat && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty">
      <div class="empty-icon">🍽️</div>
      <p>Keine Rezepte gefunden.<br>Generiere dein erstes KI-Rezept!</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => `
    <div class="recipe-card" data-id="${r.id}">
      <div class="card-emoji">${r.emoji}</div>
      <div class="card-body">
        <span class="card-category">${r.category}</span>
        <div class="card-title">${r.title}</div>
        <div class="card-meta">
          <span>🔥 ${r.kcal} kcal</span>
          <span>💪 ${r.protein}g Protein</span>
          <span>⏱️ ${r.time} Min.</span>
        </div>
      </div>
      <div class="card-actions">
        <button class="delete-btn" data-id="${r.id}" title="Löschen">🗑️</button>
      </div>
    </div>
  `).join('');

  // Card click → detail
  grid.querySelectorAll('.recipe-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.delete-btn')) return;
      openDetail(card.dataset.id);
    });
  });

  // Delete
  grid.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      deleteRecipe(btn.dataset.id);
    });
  });
}

function deleteRecipe(id) {
  recipes = recipes.filter(r => r.id !== id);
  saveRecipes(recipes);
  renderGrid();
  showToast('Rezept gelöscht');
}

// ── Filter / Search ───────────────────────────────────────
document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    activeCategory = pill.dataset.cat;
    renderGrid();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  renderGrid();
});

// ── Detail Modal ──────────────────────────────────────────
function openDetail(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const modal = document.getElementById('detailModal');
  modal.innerHTML = `
    <div class="modal-header">
      <h2 style="font-size:1.1rem">${r.category}</h2>
      <button class="close-btn" id="closeDetail">✕</button>
    </div>
    <div class="detail-emoji">${r.emoji}</div>
    <div class="detail-title">${r.title}</div>
    <div class="detail-badges">
      <span class="badge badge-kcal">🔥 ${r.kcal} kcal</span>
      <span class="badge badge-prot">💪 ${r.protein}g Protein</span>
      <span class="badge badge-time">⏱️ ${r.time} Min.</span>
      <span class="badge badge-cat">${r.category}</span>
    </div>
    <div class="section-title">Zutaten</div>
    <ul class="ingredients-list">
      ${(r.ingredients || []).map(i => `<li>${i}</li>`).join('')}
    </ul>
    <div class="section-title">Zubereitung</div>
    <ol class="steps-list">
      ${(r.steps || []).map((s, i) => `<li><span class="step-num">${i+1}</span><span>${s}</span></li>`).join('')}
    </ol>
    ${r.tip ? `<div class="tip-box"><strong>💡 Tipp:</strong> ${r.tip}</div>` : ''}
    <div style="margin-top:20px">
      <button class="btn btn-danger btn-sm" id="detailDelete">🗑️ Rezept löschen</button>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('closeDetail').addEventListener('click', closeDetail);
  document.getElementById('detailDelete').addEventListener('click', () => {
    deleteRecipe(id);
    closeDetail();
  });
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
}
document.getElementById('detailOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('detailOverlay')) closeDetail();
});

// ── AI Modal ──────────────────────────────────────────────
const aiOverlay   = document.getElementById('aiOverlay');
const apiKeyInput = document.getElementById('apiKey');

document.getElementById('btnOpenAI').addEventListener('click', () => {
  const saved = localStorage.getItem(APIKEY_KEY) || '';
  apiKeyInput.value = saved;
  aiOverlay.classList.add('open');
});
document.getElementById('closeAI').addEventListener('click', () => {
  aiOverlay.classList.remove('open');
});
aiOverlay.addEventListener('click', e => {
  if (e.target === aiOverlay) aiOverlay.classList.remove('open');
});

document.getElementById('btnGenerate').addEventListener('click', generateRecipe);

async function generateRecipe() {
  const apiKey   = apiKeyInput.value.trim();
  const category = document.getElementById('genCategory').value;
  const calories = document.getElementById('genCalories').value;
  const wish     = document.getElementById('genWish').value.trim();

  if (!apiKey) { showToast('Bitte API-Key eingeben'); return; }

  localStorage.setItem(APIKEY_KEY, apiKey);

  const btn     = document.getElementById('btnGenerate');
  const spinner = document.getElementById('aiSpinner');
  btn.disabled  = true;
  spinner.classList.add('show');

  const calorieText = calories ? `Maximale Kalorien: ${calories} kcal.` : '';
  const wishText    = wish ? `Besonderer Wunsch: ${wish}.` : '';

  const prompt = `Du bist ein Kochbuch-Autor. Erstelle ein detailliertes Rezept auf Deutsch als JSON.
Kategorie: ${category}. ${calorieText} ${wishText}

Antworte NUR mit validem JSON ohne Markdown-Codeblöcke, exakt in diesem Format:
{
  "title": "Rezepttitel",
  "emoji": "passendes Emoji",
  "kcal": Zahl,
  "protein": Zahl in Gramm,
  "time": Zubereitungszeit in Minuten als Zahl,
  "category": "${category}",
  "ingredients": ["Zutat 1 mit Menge", "Zutat 2 mit Menge"],
  "steps": ["Schritt 1", "Schritt 2", "Schritt 3"],
  "tip": "Ein kurzer hilfreicher Kochtipp"
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 1024,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data   = await res.json();
    const raw    = data.content[0].text.trim();
    const recipe = JSON.parse(raw);
    recipe.id    = 'r' + Date.now();

    recipes.unshift(recipe);
    saveRecipes(recipes);
    renderGrid();
    aiOverlay.classList.remove('open');
    showToast('🎉 Neues Rezept hinzugefügt!');
    openDetail(recipe.id);

  } catch (e) {
    showToast('Fehler: ' + e.message);
  } finally {
    btn.disabled = false;
    spinner.classList.remove('show');
  }
}

// ── Toast ─────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Service Worker ────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

// ── Init ──────────────────────────────────────────────────
renderGrid();
</script>
